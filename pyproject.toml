[project]
name = "active-inheritance-fraud"
version = "0.1.0"
description = "Active-Inheritance Guided Synthetic Generation for fraudulent text detection"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "torch>=2.0",
    "transformers>=4.40,<5",
    "openai>=1.30",
    "scipy>=1.13.1",
    "sentence-transformers>=5.1.2",
    "matplotlib>=3.9.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
